<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Katalog potravin | Nutrition Coach</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f1fb;background:#0b1220}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1b3b4b 0,#0b1220 42%);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:24px 16px 70px}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.05em;color:#6be0c1}.back,.button{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border:1px solid #35526b;border-radius:12px;background:#17283d;color:#fff;font-weight:650;cursor:pointer}h1{font-size:clamp(28px,5vw,44px);margin:28px 0 6px}.lead{color:#a9b9ca;margin:0 0 22px}.panel{background:#122033;border:1px solid #2c4159;border-radius:20px;padding:20px;box-shadow:0 14px 35px #0003}.controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(190px,1fr);gap:12px}.controls input,.controls select{width:100%;border:1px solid #3b536b;border-radius:12px;padding:14px;background:#0c1929;color:#f4f8fc;font-size:16px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{padding:9px 13px;border-radius:999px;background:#1d3445;color:#cfe5ef;font-size:13px}.category-tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 18px;scrollbar-width:thin}.category-tabs button{white-space:nowrap;border:1px solid #38536c;border-radius:999px;padding:9px 13px;color:#cde0ef;background:#15263a;cursor:pointer}.category-tabs button.active{background:#2aab91;color:#061a1c;border-color:#2aab91;font-weight:800}.table-wrap{overflow-x:auto;border:1px solid #2c4159;border-radius:15px}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:13px 12px;border-bottom:1px solid #263b52;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{background:#1b3046;color:#bbd6e8;font-size:13px;position:sticky;top:0}td:first-child{font-weight:600}tr:nth-child(even){background:#15253a}tr:hover{background:#1c3549}.category{display:block;font-size:12px;color:#8ba9bd;font-weight:400;margin-top:3px}.empty{padding:28px;text-align:center;color:#b8c9d8}.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}.pagination button:disabled{opacity:.4;cursor:not-allowed}.footer{text-align:center;color:#8da5b8;margin-top:24px;font-size:13px}@media(max-width:620px){.controls{grid-template-columns:1fr}.panel{padding:14px}th,td{padding:11px 9px}}
</style></head><body><div class="wrap"><div class="top"><a href="index.html" class="brand">NUTRITION COACH</a><a class="back" href="index.html">← Zpět do jídelníčku</a></div><h1>📚 Katalog potravin</h1><p class="lead">Všechny potraviny přehledně podle kategorií. Nutriční hodnoty na 100 g.</p><main class="panel"><div class="controls"><input id="search" type="search" placeholder="🔎 Hledat potravinu…" aria-label="Hledat potravinu"><select id="category" aria-label="Kategorie"><option value="">Všechny kategorie</option></select></div><div class="stats"><span class="pill" id="total">Načítám databázi…</span><span class="pill" id="shown"></span><span class="pill" id="categories"></span></div><div class="category-tabs" id="tabs" aria-label="Rychlý výběr kategorií"></div><div class="table-wrap"><table><thead><tr><th>Potravina</th><th>kcal</th><th>B (g)</th><th>S (g)</th><th>T (g)</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Načítám…</td></tr></tbody></table></div><div class="pagination"><button class="button" id="prev">← Předchozí</button><span id="page"></span><button class="button" id="next">Další →</button></div></main><div class="footer">Nutriční hodnoty jsou orientační. U konkrétních výrobků ověř údaje na obalu.</div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),size=50;let all=[],filtered=[],page=0;const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('cs');const n=v=>Number.isFinite(Number(v))?new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:1}).format(Number(v)):'—';const text=(tag,value,cls)=>{const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el};function render(){const q=norm($('search').value.trim()),cat=$('category').value;filtered=all.filter(f=>(!cat||f.category===cat)&&(!q||norm(f.name).includes(q)||norm(f.category).includes(q)));page=Math.min(page,Math.max(0,Math.ceil(filtered.length/size)-1));$('shown').textContent=`Zobrazeno: ${filtered.length}`;const tbody=$('rows');tbody.replaceChildren();const slice=filtered.slice(page*size,(page+1)*size);if(!slice.length){const tr=document.createElement('tr'),td=text('td','Žádné odpovídající potraviny.','empty');td.colSpan=5;tr.append(td);tbody.append(tr)}for(const f of slice){const tr=document.createElement('tr'),first=document.createElement('td');first.append(text('span',f.name),text('span',f.category||'Bez kategorie','category'));tr.append(first);for(const k of ['kcal','protein','carbs','fat'])tr.append(text('td',n(f[k])));tbody.append(tr)}$('page').textContent=`Strana ${page+1} z ${Math.max(1,Math.ceil(filtered.length/size))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=filtered.length;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.category===cat))}function choose(cat){$('category').value=cat;page=0;render()}async function load(){try{const res=await fetch('foods.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data))throw Error('Neplatný formát databáze');const saved=JSON.parse(localStorage.getItem('nutritionFoods')||'[]');const custom=JSON.parse(localStorage.getItem('nutritionCustomFoods')||'[]');const map=new Map();for(const item of [...data,...(Array.isArray(saved)?saved:[]),...(Array.isArray(custom)?custom:[])])if(item&&typeof item.name==='string')map.set(norm(item.name.trim()),item);all=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'cs'));const cats=[...new Set(all.map(f=>f.category||'Bez kategorie'))].sort((a,b)=>a.localeCompare(b,'cs'));for(const c of cats){const opt=document.createElement('option');opt.value=c;opt.textContent=c;$('category').append(opt)}$('total').textContent=`Celkem: ${all.length} potravin`;$('categories').textContent=`Kategorií: ${cats.length}`;const popular=['','Maso','Sýry','Ryby','Přílohy','Kaše','Proteiny','Ovoce','Sušené ovoce','Zelenina','Ořechová másla','Oleje a tuky','Čokolády','Džemy a marmelády'];for(const c of popular.filter(c=>!c||cats.includes(c))){const b=text('button',c||'Všechny');b.type='button';b.dataset.category=c;b.addEventListener('click',()=>choose(c));$('tabs').append(b)}render()}catch(e){$('total').textContent='Databázi se nepodařilo načíst';$('rows').replaceChildren();const tr=document.createElement('tr'),td=text('td','Zkontroluj, že je soubor foods.json ve stejné složce jako potraviny.html. ('+e.message+')','empty');td.colSpan=5;tr.append(td);$('rows').append(tr)}}$('search').addEventListener('input',()=>{page=0;render()});$('category').addEventListener('change',()=>{page=0;render()});$('prev').addEventListener('click',()=>{if(page>0){page--;render();window.scrollTo({top:0,behavior:'smooth'})}});$('next').addEventListener('click',()=>{if((page+1)*size<filtered.length){page++;render();window.scrollTo({top:0,behavior:'smooth'})}});load()})();
</script></body></html>
